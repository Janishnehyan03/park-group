<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Todo App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">📋 My Todo List</h1>
            <p class="subtitle">Stay organized and get things done!</p>
        </header>

        <!-- Add Todo Form -->
        <section class="add-todo-section">
            <div class="add-todo-container">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="What needs to be done?" 
                    maxlength="500"
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">
                    <span class="btn-text">Add Todo</span>
                    <span class="btn-icon">+</span>
                </button>
            </div>
            <div id="inputError" class="error-message" style="display: none;"></div>
        </section>

        <!-- Filter Controls -->
        <section class="filter-section">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="todo-count">
                <span id="todoCount">0</span> items left
            </div>
        </section>

        <!-- Todo List -->
        <section class="todo-list-section">
            <div id="todoList" class="todo-list">
                <!-- Todos will be dynamically added here -->
            </div>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>
                <h3>No todos yet</h3>
                <p>Add your first todo above to get started!</p>
            </div>
        </section>

        <!-- Actions -->
        <section class="actions-section">
            <button id="clearCompleted" class="clear-btn" style="display: none;">
                Clear Completed
            </button>
        </section>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message" style="display: none;"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
